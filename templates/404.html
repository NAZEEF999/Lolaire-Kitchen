<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — Lolaire's Kitchen</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #0b0a0d;
            color: #f6f1e6;
            font-family: Georgia, 'Times New Roman', serif;
            text-align: center;
            padding: 2rem;
            box-sizing: border-box;
        }
        .wrap { max-width: 32rem; }
        p.eyebrow {
            font-family: Arial, sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #c08d3b;
            margin-bottom: 1.5rem;
        }
        h1 { font-size: 2.5rem; margin: 0 0 1rem; font-weight: 800; }
        p.message { color: rgba(246, 241, 230, 0.6); margin-bottom: 2rem; line-height: 1.6; }
        .links { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
        a.btn {
            display: inline-block;
            padding: 0.85rem 1.75rem;
            border-radius: 999px;
            font-family: Arial, sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
        }
        a.btn-primary { background-color: #ab762a; color: #0b0a0d; }
        a.btn-outline { border: 1px solid rgba(246, 241, 230, 0.4); color: #f6f1e6; }
    </style>
</head>
<body>
    <div class="wrap">
        <p class="eyebrow">Lolaire's Kitchen</p>
        <h1>Page not found.</h1>
        <p class="message">
            The page you're looking for doesn't exist, or may have moved.
        </p>
        <div class="links">
            <a href="{% url 'storefront:home' %}" class="btn btn-primary">Return Home</a>
            <a href="{% url 'storefront:menu' %}" class="btn btn-outline">Browse Menu</a>
        </div>
    </div>
</body>
</html>
