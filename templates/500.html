<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something Went Wrong — Lolaire's Kitchen</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #0b0a0d;
            color: #f6f1e6;
            font-family: Georgia, 'Times New Roman', serif;
            text-align: center;
            padding: 2rem;
            box-sizing: border-box;
        }
        .wrap { max-width: 32rem; }
        p.eyebrow {
            font-family: Arial, sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #c08d3b;
            margin-bottom: 1.5rem;
        }
        h1 { font-size: 2.5rem; margin: 0 0 1rem; font-weight: 800; }
        p.message { color: rgba(246, 241, 230, 0.6); margin-bottom: 2rem; line-height: 1.6; }
        a.btn {
            display: inline-block;
            padding: 0.85rem 1.75rem;
            border-radius: 999px;
            background-color: #ab762a;
            color: #0b0a0d;
            font-family: Arial, sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <p class="eyebrow">Lolaire's Kitchen</p>
        <h1>Something went wrong on our end.</h1>
        <p class="message">
            This isn't something you did — our kitchen hit a snag.
            Please try again in a moment, or come back to the homepage.
        </p>
        <a href="/" class="btn">Return Home</a>
    </div>
</body>
</html>
