{% load static %}

<header
    id="site-nav"
    class="fixed top-0 inset-x-0 z-40 text-cream-white transition-all duration-300"
>
    <div class="max-w-7xl mx-auto px-6 lg:px-10">

        <div class="flex items-center justify-between h-20 lg:h-24 gap-6">

            <!-- LOGO (crest mark only) -->
            <a
                href="{% url 'storefront:home' %}"
                class="flex items-center shrink-0"
                aria-label="Lolaire's Kitchen home"
            >
                <img
                    src="{% static 'images/logo-mark.png' %}"
                    alt=""
                    aria-hidden="true"
                    class="h-12 w-12 lg:h-14 lg:w-14 object-contain"
                >
            </a>


            <!-- CENTER / LEFT-FLOWING NAVIGATION -->
            <nav class="hidden lg:flex items-center gap-10 font-nav text-[15px] font-medium tracking-[0.14em] uppercase mx-auto">

                <a
                    href="{% url 'storefront:home' %}"
                    class="nav-link {% if request.resolver_match.view_name == 'storefront:home' %}nav-link-active{% endif %}"
                >
                    Home
                </a>

                <a
                    href="{% url 'storefront:menu' %}"
                    class="nav-link {% if 'menu' in request.resolver_match.view_name %}nav-link-active{% endif %}"
                >
                    Menu
                </a>

                <a
                    href="{% url 'storefront:about' %}"
                    class="nav-link {% if request.resolver_match.view_name == 'storefront:about' %}nav-link-active{% endif %}"
                >
                    About
                </a>

                <a
                    href="{% url 'reservations:create' %}"
                    class="nav-link"
                >
                    Reservations
                </a>

                <a
                    href="{% url 'storefront:contact' %}"
                    class="nav-link {% if request.resolver_match.view_name == 'storefront:contact' %}nav-link-active{% endif %}"
                >
                    Contact
                </a>

            </nav>


            <!-- RIGHT ACTIONS -->
            <div class="hidden lg:flex items-center gap-6 shrink-0">

                <a
                    href="{% url 'storefront:order_lookup' %}"
                    class="nav-link font-nav text-[15px] font-medium tracking-[0.14em] uppercase"
                >
                    Track Order
                </a>

                <span class="w-px h-5 bg-cream-white/15"></span>

                <!-- CART -->
                <a
                    href="{% url 'storefront:cart' %}"
                    class="relative flex items-center justify-center text-cream-white hover:text-gold transition"
                    aria-label="Shopping cart"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        class="w-5 h-5"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>

                    {% if cart_count %}
                    <span class="absolute -top-2 -right-3 bg-gold text-ink text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center">
                        {{ cart_count }}
                    </span>
                    {% endif %}
                </a>


                <!-- ORDER BUTTON -->
                <a
                    href="{% url 'storefront:menu' %}"
                    class="btn btn-primary btn-sm"
                >
                    Order Now &rarr;
                </a>

            </div>


            <!-- MOBILE CART + MENU BUTTON -->
            <div class="lg:hidden flex items-center gap-1 ml-auto">

                <a
                    href="{% url 'storefront:cart' %}"
                    class="relative w-10 h-10 flex items-center justify-center"
                    aria-label="Shopping cart"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        class="w-5 h-5"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>

                    {% if cart_count %}
                    <span class="absolute top-1 right-0 bg-gold text-ink text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center">
                        {{ cart_count }}
                    </span>
                    {% endif %}
                </a>

                <button
                    id="mobile-nav-toggle"
                    type="button"
                    class="w-10 h-10 flex items-center justify-center"
                    aria-label="Toggle menu"
                    aria-expanded="false"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        class="w-6 h-6"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>

            </div>

        </div>

    </div>


    <!-- MOBILE NAVIGATION -->
    <div
        id="mobile-nav"
        class="mobile-nav lg:hidden bg-ink border-t border-cream-white/10"
    >
        <nav class="max-w-7xl mx-auto px-6 py-5 flex flex-col font-nav text-lg tracking-[0.08em]">

            <a href="{% url 'storefront:home' %}" class="py-4 border-b border-cream-white/10">Home</a>
            <a href="{% url 'storefront:menu' %}" class="py-4 border-b border-cream-white/10">Menu</a>
            <a href="{% url 'storefront:about' %}" class="py-4 border-b border-cream-white/10">About</a>
            <a href="{% url 'reservations:create' %}" class="py-4 border-b border-cream-white/10">Reservations</a>
            <a href="{% url 'storefront:contact' %}" class="py-4 border-b border-cream-white/10">Contact</a>
            <a href="{% url 'storefront:order_lookup' %}" class="py-4 border-b border-cream-white/10">Track Order</a>

            <a href="{% url 'storefront:menu' %}" class="btn btn-primary mt-5 justify-center font-body text-sm">Order Now</a>

        </nav>
    </div>

</header>
