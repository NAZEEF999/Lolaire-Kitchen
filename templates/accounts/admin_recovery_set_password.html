{% extends "base.html" %}
{% block title %}Set New Password — Restaurant Management System{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-16 bg-white p-8 rounded-lg shadow-sm border border-gray-200">
    <h1 class="text-xl font-semibold mb-6">Set new password</h1>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {% for field in form %}
            <div>
                <label class="block text-sm font-medium mb-1" for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<p class="text-sm text-red-600 mt-1">{{ field.errors.0 }}</p>{% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="w-full bg-blue-600 text-white rounded-md py-2 text-sm font-medium hover:bg-blue-700">
            Set password
        </button>
    </form>
</div>
{% endblock %}
